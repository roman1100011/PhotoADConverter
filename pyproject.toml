[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "film-lab"
version = "0.1.0"
description = "Desktop workspace for processing scanned film negatives"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
film-lab = "film_lab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
